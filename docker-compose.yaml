services:
  hotel-cancellation:
    build: .
    image: hotel-cancellation
    container_name: hotel-cancellation
    ports:
      - "9696:9696"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('localhost', 9696), 2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
